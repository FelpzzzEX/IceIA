services:
  db_rag:
    image: pgvector/pgvector:pg16
    container_name: ufop_rag_postgres
    restart: always
    environment:
      POSTGRES_DB: rag_database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ufop_rag_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    depends_on:
      - db_rag

volumes:
  pgvector_data:
    name: pgvector_data
